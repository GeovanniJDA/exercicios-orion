name: exercicio-extra

services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    # Development: local src/ mounted, node restarts on change
    volumes:
      - ./api/src:/app/src
    command: ["node", "--watch", "src/index.js"]
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  adminer:
    image: adminer:latest # ponytail: unpinned tag — pin a version before real use
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    name: orion-extra-net

volumes:
  pgdata:
    name: orion-extra-pgdata
